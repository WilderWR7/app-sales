<header class="sticky top-0 z-50 bg-white dark:bg-black border-b border-gray-200 dark:border-gray-800 text-gray-900 dark:text-white shadow-md dark:shadow-xl transition-colors duration-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand & Navigation Links -->
      <div class="flex items-center space-x-8">
        <!-- Logo / Brand -->
        <a routerLink="/dashboard/products" class="flex items-center space-x-3 group">
          <div class="w-10 h-10 rounded-full overflow-hidden shadow-md shadow-red-900/30 ring-2 ring-red-500/30 group-hover:scale-105 transition-transform">
            <img src="assets/logo.webp" alt="Mercatech Logo" class="w-full h-full object-cover" />
          </div>
          <span class="text-lg font-black tracking-tight text-gray-900 dark:text-white group-hover:text-red-600 dark:group-hover:text-red-400 transition-colors">
            Mercatech
          </span>
        </a>

        <!-- Desktop Nav Links -->
        <nav class="hidden sm:flex items-center space-x-1 text-sm font-medium">
          <a routerLink="/dashboard/products" 
             routerLinkActive="text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40 font-bold" 
             class="px-3.5 py-2 rounded-xl text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-800/60 transition-all flex items-center space-x-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
            </svg>
            <span>Catálogo</span>
          </a>

          <a routerLink="/dashboard/sales-history" 
             routerLinkActive="text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40 font-bold" 
             class="px-3.5 py-2 rounded-xl text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-800/60 transition-all flex items-center space-x-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
            </svg>
            <span>Historial de Ventas</span>
          </a>
        </nav>
      </div>

      <!-- Right Action Items (Theme Toggle & Auth Controls) -->
      <div class="flex items-center space-x-2 sm:space-x-4">
        <!-- Dark Mode Toggle Button -->
        <app-theme-toggle></app-theme-toggle>

        <!-- Authenticated State -->
        <app-user-dropdown></app-user-dropdown>

        <!-- Mobile Menu Button -->
        <div class="flex sm:hidden items-center">
          <button (click)="toggleMobileMenu()" type="button" class="p-2 text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Dropdown -->
  <div *ngIf="isMobileMenuOpen" class="sm:hidden bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 px-4 pt-2 pb-4 space-y-2">
    <a routerLink="/dashboard/products" (click)="isMobileMenuOpen = false" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800">
      Catálogo de Productos
    </a>
    <a routerLink="/dashboard/sales-history" (click)="isMobileMenuOpen = false" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800">
      Historial de Ventas
    </a>
    <ng-container *ngIf="authService.currentUser() as user">
      <div class="py-2 border-t border-gray-100 dark:border-gray-800 mt-2 pt-4">
        <p class="text-sm font-semibold text-gray-900 dark:text-white px-3">{{ user.name }}</p>
        <p class="text-xs text-gray-500 dark:text-gray-400 px-3 mb-2">{{ user.email }}</p>
        <button (click)="logout()" class="w-full text-left px-3 py-2 rounded-md text-base font-medium text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 mt-1">
          Cerrar Sesión
        </button>
      </div>
    </ng-container>
  </div>
</header>
