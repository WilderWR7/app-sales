<div class="absolute top-3 right-3">
  <span *ngIf="stock > 10" class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide uppercase bg-emerald-100 dark:bg-emerald-500/20 text-emerald-800 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30 shadow-sm backdrop-blur-md">
    <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-emerald-500 dark:bg-emerald-400"></span>
    Disponible ({{ stock }})
  </span>
  <span *ngIf="stock > 0 && stock <= 10" class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide uppercase bg-amber-100 dark:bg-amber-500/20 text-amber-800 dark:text-amber-400 border border-amber-200 dark:border-amber-500/30 shadow-sm backdrop-blur-md">
    <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-amber-500 dark:bg-amber-400 animate-pulse"></span>
    Bajo ({{ stock }})
  </span>
  <span *ngIf="stock === 0" class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide uppercase bg-red-100 dark:bg-red-500/20 text-red-800 dark:text-red-400 border border-red-200 dark:border-red-500/30 shadow-sm backdrop-blur-md">
    <svg class="w-2.5 h-2.5 mr-1 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
    Agotado (0)
  </span>
</div>
