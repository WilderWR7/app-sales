<ng-container *ngIf="authService.currentUser() as user">
  <div class="relative hidden sm:block">
    <button (click)="toggleMenu()" 
            type="button"
            class="flex items-center space-x-3 p-1.5 rounded-lg bg-gray-50 dark:bg-gray-800/80 hover:bg-gray-100 dark:hover:bg-gray-800 border border-gray-200 dark:border-gray-700 transition-all focus:outline-none focus:ring-2 focus:ring-red-500">
      <div class="w-8 h-8 rounded-md bg-gradient-to-tr from-red-600 to-red-800 flex items-center justify-center text-white font-bold text-sm shadow">
        {{ user.name.charAt(0).toUpperCase() }}
      </div>
      <div class="flex flex-col text-left">
        <span class="text-xs font-semibold text-gray-900 dark:text-white max-w-[120px] truncate">{{ user.name }}</span>
        <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-mono flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 dark:bg-emerald-400 animate-pulse"></span>
          ONLINE
        </span>
      </div>
      <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <!-- User Dropdown Menu -->
    <div *ngIf="isOpen" 
         class="absolute right-0 mt-2 w-56 rounded-lg bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 shadow-2xl py-1 text-gray-900 dark:text-gray-200 z-50 animate-fadeIn">
      <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-950/50">
        <p class="text-xs text-gray-500 dark:text-gray-400 font-mono">Usuario Autenticado</p>
        <p class="text-sm font-semibold text-gray-900 dark:text-white truncate">{{ user.name }}</p>
        <p class="text-xs text-gray-500 dark:text-gray-400 truncate">{{ user.email }}</p>
      </div>
      <button (click)="logout()" 
              type="button"
              class="w-full text-left px-4 py-2.5 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 flex items-center space-x-2 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span class="font-medium">Cerrar Sesión</span>
      </button>
    </div>
  </div>
</ng-container>
