<!-- Backdrop Overlay -->
<div *ngIf="cartStore.isOpen()" 
     (click)="cartStore.closeDrawer()"
     class="fixed inset-0 z-40 bg-black/50 backdrop-blur-xs transition-opacity animate-fadeIn"></div>

<!-- Slide-over Drawer -->
<div [class.translate-x-full]="!cartStore.isOpen()"
     [class.translate-x-0]="cartStore.isOpen()"
     class="fixed inset-y-0 right-0 z-50 w-full sm:w-[480px] bg-white dark:bg-gray-900 shadow-2xl border-l border-gray-200 dark:border-gray-800 flex flex-col transition-transform duration-300 ease-in-out">
  
  <!-- Drawer Header -->
  <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between bg-gray-50 dark:bg-gray-950/50">
    <div class="flex items-center space-x-2">
      <div class="p-2 rounded-lg bg-red-100 dark:bg-red-950/40 text-red-600 dark:text-red-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
      </div>
      <div>
        <h3 class="text-base font-bold text-gray-900 dark:text-white">Carrito de Compras</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400 font-mono">{{ cartStore.totalCount() }} ítems seleccionados</p>
      </div>
    </div>

    <button (click)="cartStore.closeDrawer()" 
            type="button" 
            class="p-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Error Alert Banner -->
  <div *ngIf="errorMessage() || cartStore.hasInvalidItems()" class="p-3.5 bg-red-50 dark:bg-red-950/60 border-b border-red-200 dark:border-red-800 text-xs text-red-700 dark:text-red-300 flex items-center animate-fadeIn font-medium">
    <svg class="w-4 h-4 mr-2 flex-shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
    <span>{{ errorMessage() || 'Existen productos con cantidades superiores al stock disponible. Ajústalas para continuar.' }}</span>
  </div>

  <!-- Items List Container -->
  <div class="flex-1 overflow-y-auto p-5 space-y-4">
    <ng-container *ngIf="cartStore.hasItems(); else emptyCart">
      <app-cart-item-row *ngFor="let item of cartStore.cartItems(); trackBy: trackByProductId" [item]="item"></app-cart-item-row>
    </ng-container>

    <ng-template #emptyCart>
      <div class="h-full flex flex-col items-center justify-center text-center py-12 px-4 space-y-3">
        <div class="w-16 h-16 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-400">
          <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </div>
        <p class="text-sm font-semibold text-gray-900 dark:text-white">El carrito está vacío</p>
        <p class="text-xs text-gray-500 dark:text-gray-400 max-w-xs">
          Haz clic en el botón de carrito en cualquier producto del catálogo para agregarlo aquí.
        </p>
      </div>
    </ng-template>
  </div>

  <!-- Cart Footer Summary & Action -->
  <app-cart-summary [isSubmitting]="isSubmitting()" (processSale)="handleCheckout()"></app-cart-summary>
</div>

<!-- Sale Success Confirmation Modal -->
<app-sale-success-modal [response]="successResponse()" (close)="closeModal()"></app-sale-success-modal>
