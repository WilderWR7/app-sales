<div
  class="min-h-[calc(100vh-4rem)] bg-gray-50 dark:bg-gray-950 transition-colors duration-200 py-8 px-4 sm:px-6 lg:px-8"
>
  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Modular Page Header & Actions -->
    <product-header
      [totalItems]="totalItems()"
      [searchControl]="searchControl"
    ></product-header>

    <!-- Error Alert -->
    <app-error-alert [errorMessage]="errorMessage"></app-error-alert>

    <product-skeleton [isLoading]="isLoading()" ></product-skeleton>

    <!-- Modular Product Grid -->
    <div
      *ngIf="!isLoading() && hasProducts()"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 animate-fadeIn"
    >
      <product-card
        *ngFor="let product of products()"
        [product]="product"
      ></product-card>
    </div>

    <!-- Empty State -->
    <product-empty-state
      *ngIf="!isLoading() && !hasProducts()"
      [errorMessage]="errorMessage"
    >
    </product-empty-state>

    <!-- Modular Pagination UI -->
    <app-pagination
      *ngIf="!isLoading() && hasProducts() && totalPages() > 1"
      [meta]="pagination()?.meta"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="goToPage($event)"
    >
    </app-pagination>
  </div>
</div>

<!-- Floating Cart Toggle Button -->
<button (click)="cartStore.toggleDrawer()"
        type="button"
        class="fixed bottom-6 right-6 z-30 p-4 bg-red-600 hover:bg-red-700 text-white rounded-full shadow-2xl hover:scale-105 active:scale-95 transition-all flex items-center justify-center space-x-2 group"
        title="Ver Carrito">
  <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
  </svg>
  <span *ngIf="cartStore.totalCount() > 0" 
        class="absolute -top-1 -right-1 px-2 py-0.5 bg-white text-red-600 font-extrabold text-xs rounded-full border-2 border-red-600 shadow">
    {{ cartStore.totalCount() }}
  </span>
</button>

<!-- Slide-Over Cart Drawer -->
<app-cart-drawer (saleCompleted)="loadProducts()"></app-cart-drawer>
