<div
  class="group bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 overflow-hidden shadow-sm hover:shadow-xl dark:hover:shadow-red-900/10 transition-all duration-300 transform hover:-translate-y-1 flex flex-col h-full"
>
  <!-- Image Placeholder & Badge -->
  <div
    class="relative h-48 bg-gray-100 dark:bg-gray-800 flex items-center justify-center p-6 overflow-hidden"
  >
    <img
      *ngIf="product.image || product.image_url"
      [src]="product.image || product.image_url"
      [alt]="product.name"
      class="object-cover w-full h-full group-hover:scale-105 transition-transform duration-500"
    />
    <svg
      *ngIf="!product.image && !product.image_url"
      class="w-16 h-16 text-gray-300 dark:text-gray-700"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
      />
    </svg>

    <!-- Stock Badge Subcomponent -->
    <app-stock-badge [stock]="product.stock"></app-stock-badge>
  </div>

  <!-- Card Content -->
  <div class="p-5 flex flex-col flex-grow">
    <div class="flex justify-between items-start mb-2">
      <h3
        class="text-base font-bold text-gray-900 dark:text-white leading-tight line-clamp-2"
      >
        {{ product.name }}
      </h3>
    </div>
    <p
      *ngIf="product.sku"
      class="text-xs font-mono text-gray-500 dark:text-gray-400 mb-3"
    >
      SKU: {{ product.sku }}
    </p>
    <p
      *ngIf="product.description"
      class="text-sm text-gray-600 dark:text-gray-300 line-clamp-2 mb-4"
    >
      {{ product.description }}
    </p>

    <div
      class="mt-auto pt-4 flex items-center justify-between border-t border-gray-100 dark:border-gray-800/80"
    >
      <span class="text-lg font-black text-gray-900 dark:text-white"
        >${{ product.price }}</span
      >

      <button
        (click)="addToCart()"
        type="button"
        [disabled]="product.stock === 0"
        class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-red-600 hover:text-white dark:hover:bg-red-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed group/btn"
        title="Agregar al carrito"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
