<div
  *ngIf="isLoading"
  class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 animate-pulse mt-6"
>
  <div
    *ngFor="let i of [1, 2, 3, 4, 5, 6, 7, 8]"
    class="bg-white dark:bg-gray-900 rounded-2xl p-4 border border-gray-200 dark:border-gray-800 h-72 flex flex-col"
  >
    <div class="h-32 bg-gray-200 dark:bg-gray-800 rounded-xl mb-4 w-full"></div>
    <div class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-3/4 mb-2"></div>
    <div class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-1/2 mb-auto"></div>
    <div
      class="flex justify-between items-center mt-4 pt-4 border-t border-gray-100 dark:border-gray-800"
    >
      <div class="h-6 bg-gray-200 dark:bg-gray-800 rounded w-1/3"></div>
      <div class="h-6 bg-gray-200 dark:bg-gray-800 rounded-full w-1/4"></div>
    </div>
  </div>
</div>
