<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
  <div>
    <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">Catálogo de Productos</h1>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400 font-mono">
      Mostrando {{ totalItems }} artículos en inventario
    </p>
  </div>

  <!-- Search Bar -->
  <div class="relative max-w-md w-full sm:w-96 group">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="h-5 w-5 text-gray-400 group-focus-within:text-red-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
    <input type="text"
           [formControl]="searchControl"
           placeholder="Buscar por nombre o SKU..."
           class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-700 rounded-xl leading-5 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 sm:text-sm transition-shadow shadow-sm hover:shadow-md dark:shadow-gray-900/50">
    <button *ngIf="searchControl.value" 
            (click)="searchControl.setValue('')"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-red-500">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
