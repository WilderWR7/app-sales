<div class="min-h-[calc(100vh-4rem)] bg-gray-50 dark:bg-gray-950 transition-colors duration-200 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <app-sales-table-header
      [totalSales]="totalSalesCount()"
      [summary]="summary()"
      [isLoadingSummary]="isLoadingSummary()">
    </app-sales-table-header>

    <!-- Error Alert -->
    <app-error-alert [errorMessage]="errorMessage"></app-error-alert>

    <!-- Success Toast Alert -->
    <div *ngIf="successMessage()" class="p-4 bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 rounded-2xl text-emerald-800 dark:text-emerald-300 text-sm font-semibold flex items-center justify-between animate-fadeIn">
      <div class="flex items-center space-x-2">
        <svg class="w-5 h-5 text-emerald-600 dark:text-emerald-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span>{{ successMessage() }}</span>
      </div>
      <button (click)="successMessage.set(null)" type="button" class="text-emerald-600 hover:text-emerald-800 dark:hover:text-emerald-200">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Sales Table -->
    <app-sales-table
      [sales]="sales()"
      [meta]="pagination()?.meta"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [isLoading]="isLoading()"
      (viewDetail)="openDetailModal($event)"
      (requestDelete)="openDeleteModal($event)"
      (pageChange)="goToPage($event)">
    </app-sales-table>
  </div>
</div>

<!-- Modal: Detalle de Venta -->
<app-sale-detail-modal
  [sale]="selectedSaleForDetail()"
  (close)="closeDetailModal()">
</app-sale-detail-modal>

<!-- Modal: Confirmación de Anulación (Devolución de stock) -->
<app-confirm-delete-modal
  [sale]="selectedSaleForDelete()"
  [isDeleting]="isDeleting()"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()">
</app-confirm-delete-modal>
