<div class="space-y-6 pb-6 border-b border-gray-200 dark:border-gray-800">
  <!-- Title & Description Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div class="flex items-center space-x-3">
      <div
        class="p-2.5 rounded-2xl bg-red-100 dark:bg-red-950/50 text-red-600 dark:text-red-400 shadow-inner"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"
          />
        </svg>
      </div>
      <div>
        <h1
          class="text-2xl font-black text-gray-900 dark:text-white tracking-tight"
        >
          Historial de Ventas
        </h1>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
          Auditoría de transacciones, consulta de recibos y anulación con
          devolución automática de inventario.
        </p>
      </div>
    </div>

    <!-- Quick total count badge -->
    <div
      class="px-4 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl shadow-xs flex items-center space-x-2 self-start md:self-auto"
    >
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="text-xs text-gray-500 dark:text-gray-400"
        >Total Transacciones:</span
      >
      <span class="font-mono font-bold text-gray-900 dark:text-white text-sm">
        {{ summary?.total_sales_count ?? totalSales }}
      </span>
    </div>
  </div>

  <!-- KPI Summary Cards Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
    <!-- 1. Total Revenue Card -->
    <app-kpi-card
      title="Total Recaudado"
      [value]="'$' + (summary?.total_revenue || 0).toFixed(2)"
      [subtitle]="(summary?.total_items_sold || 0) + ' un. vendidas'"
      [isLoading]="isLoadingSummary"
      iconColorClass="text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40"
      hoverBorderClass="hover:border-red-500/50"
    >
      <svg
        icon
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
    </app-kpi-card>

    <!-- 2. Today's Revenue Card -->
    <app-kpi-card
      title="Ventas de Hoy"
      [value]="'$' + (summary?.today_revenue || 0).toFixed(2)"
      subtitle="Ingreso diario acumulado"
      [isLoading]="isLoadingSummary"
      iconColorClass="text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40"
      valueColorClass="text-emerald-600 dark:text-emerald-400"
      hoverBorderClass="hover:border-emerald-500/50"
    >
      <svg
        icon
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
    </app-kpi-card>

    <!-- 3. Average Ticket Card -->
    <app-kpi-card
      title="Ticket Promedio"
      [value]="'$' + (summary?.average_ticket || 0).toFixed(2)"
      subtitle="Promedio por transacción"
      [isLoading]="isLoadingSummary"
      iconColorClass="text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/40"
      hoverBorderClass="hover:border-blue-500/50"
    >
      <svg
        icon
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
        />
      </svg>
    </app-kpi-card>

    <!-- 4. Top Product Card -->
    <app-kpi-card
      title="Producto Estrella"
      [value]="summary?.top_product?.name || 'N/A'"
      [subtitle]="(summary?.top_product?.total_quantity || 0) + ' un. vendidas'"
      [isLoading]="isLoadingSummary"
      iconColorClass="text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/40"
      hoverBorderClass="hover:border-amber-500/50"
    >
      <svg
        icon
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"
        />
      </svg>
    </app-kpi-card>

    <!-- 5. Cancelled Sales Card -->
    <app-kpi-card
      title="Ventas Anuladas"
      [value]="summary?.cancelled_sales_count || 0"
      [subtitle]="
        '$' + (summary?.cancelled_revenue || 0).toFixed(2) + ' devueltos'
      "
      [isLoading]="isLoadingSummary"
      iconColorClass="text-red-500 bg-red-50 dark:bg-red-950/40"
      valueColorClass="text-red-600 dark:text-red-400"
      hoverBorderClass="hover:border-red-500/50"
    >
      <svg
        icon
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"
        />
      </svg>
    </app-kpi-card>
  </div>
</div>
