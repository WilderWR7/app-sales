<div *ngIf="sale" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs animate-fadeIn">
  <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-6 text-center transform scale-100 transition-all">
    <!-- Warning Icon -->
    <div class="w-16 h-16 bg-red-100 dark:bg-red-950/50 text-red-600 dark:text-red-400 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
      <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>

    <div>
      <h3 class="text-xl font-black text-gray-900 dark:text-white">¿Anular Venta #{{ sale.id }}?</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-2 leading-relaxed">
        Esta acción cancelará la transacción y <strong class="text-red-600 dark:text-red-400">restituirá automáticamente el stock</strong> de todos los productos al inventario.
      </p>
    </div>

    <!-- Details Summary -->
    <div class="bg-gray-50 dark:bg-gray-800/60 rounded-2xl p-4 border border-gray-200 dark:border-gray-700/60 text-left space-y-1.5 font-mono text-xs">
      <div class="flex justify-between">
        <span class="text-gray-500 dark:text-gray-400">ID Venta:</span>
        <span class="font-bold text-gray-900 dark:text-white">#{{ sale.id }}</span>
      </div>
      <div class="flex justify-between">
        <span class="text-gray-500 dark:text-gray-400">Monto Total:</span>
        <span class="font-bold text-red-600 dark:text-red-400">${{ sale.total.toFixed(2) }}</span>
      </div>
      <div class="flex justify-between">
        <span class="text-gray-500 dark:text-gray-400">Fecha:</span>
        <span class="text-gray-700 dark:text-gray-300">{{ sale.created_at | date:'dd/MM/yyyy' }}</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center space-x-3 pt-2">
      <button (click)="onCancel()"
              [disabled]="isDeleting"
              type="button"
              class="flex-1 py-3 rounded-xl border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 font-bold text-sm transition-colors">
        Cancelar
      </button>

      <button (click)="onConfirm()"
              [disabled]="isDeleting"
              type="button"
              class="flex-1 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm shadow-lg shadow-red-600/30 disabled:opacity-50 transition-all flex items-center justify-center space-x-2">
        <svg *ngIf="isDeleting" class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ isDeleting ? 'Anulando...' : 'Sí, Anular Venta' }}</span>
      </button>
    </div>
  </div>
</div>
