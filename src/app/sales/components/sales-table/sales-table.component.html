<div class="space-y-4">
  <!-- Table Container -->
  <div
    class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl overflow-hidden shadow-sm"
  >
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr
            class="bg-gray-50 dark:bg-gray-950/60 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider border-b border-gray-200 dark:border-gray-800"
          >
            <th class="py-3.5 px-4 sm:px-6"># ID Venta</th>
            <th class="py-3.5 px-4">Fecha</th>
            <th class="py-3.5 px-4">Vendedor</th>
            <th class="py-3.5 px-4 text-right">Monto Total</th>
            <th class="py-3.5 px-4 sm:px-6 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-gray-800/60 text-sm">
          <!-- Loading Skeletons -->
          <ng-container *ngIf="isLoading">
            <tr *ngFor="let i of [1, 2, 3, 4, 5]" class="animate-pulse">
              <td class="py-4 px-4 sm:px-6">
                <div
                  class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-16"
                ></div>
              </td>
              <td class="py-4 px-4">
                <div
                  class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-32"
                ></div>
              </td>
              <td class="py-4 px-4">
                <div
                  class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-24"
                ></div>
              </td>
              <td class="py-4 px-4 text-right">
                <div
                  class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-20 ml-auto"
                ></div>
              </td>
              <td class="py-4 px-4 sm:px-6 text-center">
                <div
                  class="h-8 bg-gray-200 dark:bg-gray-800 rounded w-24 mx-auto"
                ></div>
              </td>
            </tr>
          </ng-container>

          <!-- Sales rows -->
          <ng-container *ngIf="!isLoading && sales.length > 0">
            <tr
              *ngFor="let sale of sales"
              class="hover:bg-gray-50/70 dark:hover:bg-gray-800/40 transition-colors group"
            >
              <!-- ID -->
              <td
                class="py-4 px-4 sm:px-6 font-mono font-bold text-gray-900 dark:text-white"
              >
                #{{ sale.id }}
              </td>

              <!-- Date -->
              <td
                class="py-4 px-4 text-gray-600 dark:text-gray-300 font-mono text-xs"
              >
                {{ sale.created_at | date: "dd/MM/yyyy" }}
              </td>

              <!-- User / Seller -->
              <td class="py-4 px-4">
                <div class="flex items-center space-x-2">
                  <div
                    class="w-6 h-6 rounded-full bg-red-100 dark:bg-red-950/60 text-red-600 dark:text-red-400 flex items-center justify-center text-xs font-bold"
                  >
                    {{ (sale.user.name || "S").charAt(0).toUpperCase() }}
                  </div>
                  <span
                    class="font-medium text-gray-900 dark:text-white text-xs truncate max-w-[140px]"
                  >
                    {{ sale.user.name }}
                  </span>
                </div>
              </td>

              <!-- Total Amount -->
              <td
                class="py-4 px-4 text-right font-mono font-black text-gray-900 dark:text-white text-base"
              >
                ${{ sale.total.toFixed(2) }}
              </td>

              <!-- Actions -->
              <td class="py-4 px-4 sm:px-6 text-center">
                <div class="flex items-center justify-center space-x-1.5">
                  <button
                    (click)="onView(sale)"
                    type="button"
                    class="p-2 text-gray-600 dark:text-gray-300 hover:text-red-600 dark:hover:text-red-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors"
                    title="Ver Detalle de Recibo"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  </button>

                  <button
                    (click)="onDelete(sale)"
                    type="button"
                    class="p-2 text-red-500 hover:text-red-700 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-lg transition-colors"
                    title="Anular Venta y Restituir Stock"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                      />
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
          </ng-container>

          <!-- Empty State -->
          <ng-container *ngIf="!isLoading && sales.length === 0">
            <tr>
              <td
                colspan="5"
                class="py-12 text-center text-gray-500 dark:text-gray-400 space-y-2"
              >
                <svg
                  class="w-12 h-12 text-gray-300 dark:text-gray-700 mx-auto"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                  />
                </svg>
                <p class="text-sm font-semibold">
                  No se encontraron ventas registradas
                </p>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination Component -->
  <app-pagination
    *ngIf="!isLoading && sales.length > 0 && totalPages > 1"
    [meta]="meta"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="onPageChange($event)"
  >
  </app-pagination>
</div>
