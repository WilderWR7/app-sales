<div class="border-t border-gray-200 dark:border-gray-800 p-4 bg-white dark:bg-gray-900 space-y-3">
  <!-- Summary calculation lines -->
  <div class="space-y-1.5 text-sm">
    <div class="flex justify-between text-gray-500 dark:text-gray-400">
      <span>Cantidad de artículos</span>
      <span class="font-mono font-bold text-gray-900 dark:text-white">{{ cartStore.totalCount() }}</span>
    </div>
    <div class="flex justify-between text-base font-black text-gray-900 dark:text-white pt-2 border-t border-gray-100 dark:border-gray-800">
      <span>TOTAL GENERAL</span>
      <span class="font-mono text-red-600 dark:text-red-400 text-lg">${{ cartStore.totalAmount().toFixed(2) }}</span>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex items-center space-x-2 pt-2">
    <button (click)="cartStore.clearCart()"
            type="button"
            [disabled]="!cartStore.hasItems() || isSubmitting"
            class="px-3 py-3 rounded-xl border border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-40 disabled:cursor-not-allowed transition-colors text-xs font-semibold">
      Vaciar
    </button>

    <button (click)="onCheckout()"
            type="button"
            [disabled]="!cartStore.hasItems() || cartStore.hasInvalidItems() || isSubmitting"
            class="flex-1 py-3 px-4 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm shadow-lg shadow-red-600/30 hover:shadow-red-600/50 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none transition-all flex items-center justify-center space-x-2"
            [title]="cartStore.hasInvalidItems() ? 'Hay productos que superan el stock disponible' : 'Procesar Venta'">
      <svg *ngIf="isSubmitting" class="animate-spin h-5 w-5 text-white mr-1" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span>{{ isSubmitting ? 'Procesando Venta...' : 'Procesar Venta ($' + cartStore.totalAmount().toFixed(2) + ')' }}</span>
    </button>
  </div>
</div>
