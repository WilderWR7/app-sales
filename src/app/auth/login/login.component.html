<div class="relative min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50 dark:bg-gray-950 transition-colors duration-200">
  <div class="max-w-md w-full space-y-8">

    <!-- Header Card -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl dark:shadow-2xl border border-gray-200 dark:border-gray-800 p-8 transition-colors duration-200">
      
      <!-- Top Branding -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-red-600 to-red-700 text-white shadow-lg shadow-red-900/30 mb-4 transform hover:rotate-3 transition-transform">
          <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white tracking-tight">
          Iniciar Sesión
        </h2>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400 font-sans">
          Acceda a la plataforma de <span class="font-semibold text-red-600 dark:text-red-400">Mercatech Bolivia</span>
        </p>
      </div>

      <!-- Error Alert Message -->
      <div *ngIf="errorMessage" class="mb-6 p-4 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800/50 flex items-start space-x-3 animate-fadeIn">
        <svg class="w-5 h-5 text-red-600 dark:text-red-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div class="text-sm text-red-700 dark:text-red-300 font-medium">
          {{ errorMessage }}
        </div>
      </div>

      <!-- Reactive Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5">
            Correo Electrónico
          </label>
          <div class="relative rounded-lg shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
            </div>
            <input id="email" 
                   type="email" 
                   formControlName="email"
                   placeholder="ejemplo@mercatech.com"
                   class="block w-full pl-10 pr-3 py-2.5 bg-gray-50 dark:bg-gray-800/80 border text-gray-900 dark:text-gray-100 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors text-sm font-medium"
                   [ngClass]="{
                     'border-red-500 dark:border-red-500 focus:ring-red-500': email?.invalid && (email?.dirty || email?.touched),
                     'border-gray-300 dark:border-gray-700': !(email?.invalid && (email?.dirty || email?.touched))
                   }">
          </div>
          <!-- Validation message -->
          <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="mt-1.5 text-xs text-red-600 dark:text-red-400 space-y-0.5">
            <p *ngIf="email?.errors?.['required']">El correo electrónico es requerido.</p>
            <p *ngIf="email?.errors?.['email']">Ingrese un formato de correo válido.</p>
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5">
            Contraseña
          </label>
          <div class="relative rounded-lg shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input id="password" 
                   [type]="showPassword ? 'text' : 'password'" 
                   formControlName="password"
                   placeholder="••••••••"
                   class="block w-full pl-10 pr-10 py-2.5 bg-gray-50 dark:bg-gray-800/80 border text-gray-900 dark:text-gray-100 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors text-sm font-medium"
                   [ngClass]="{
                     'border-red-500 dark:border-red-500 focus:ring-red-500': password?.invalid && (password?.dirty || password?.touched),
                     'border-gray-300 dark:border-gray-700': !(password?.invalid && (password?.dirty || password?.touched))
                   }">
            <!-- Toggle password visibility -->
            <button type="button" 
                    (click)="togglePasswordVisibility()" 
                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
              <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg *ngIf="showPassword" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a8.959 8.959 0 014.122-.963c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
              </svg>
            </button>
          </div>
          <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="mt-1.5 text-xs text-red-600 dark:text-red-400">
            <p *ngIf="password?.errors?.['required']">La contraseña es requerida.</p>
            <p *ngIf="password?.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres.</p>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" 
                [disabled]="isLoading"
                class="w-full flex items-center justify-center py-3 px-4 rounded-xl font-bold text-white bg-red-600 hover:bg-red-700 active:bg-red-800 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-red-900/30 transition-all duration-200 transform active:scale-[0.99] text-sm tracking-wide uppercase">
          <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ isLoading ? 'Ingresando...' : 'Iniciar Sesión' }}</span>
        </button>

      </form>

      <!-- Footer Link -->
      <div class="mt-6 text-center text-xs text-gray-500 dark:text-gray-400">
        ¿No tienes una cuenta aún?
        <a routerLink="/register" class="font-semibold text-red-600 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 ml-1 transition-colors">
          Regístrate aquí
        </a>
      </div>

    </div>
  </div>

  <!-- Theme Toggle Floating Button -->
  <div class="absolute top-4 right-4 sm:top-6 sm:right-8">
    <app-theme-toggle></app-theme-toggle>
  </div>
</div>
